WHERE s.invoice_date >= DATE '2025-01-01' AND s.invoice_date < DATE '2026-01-01'
GROUP BY c.customer_name ORDER BY 2 DESC LIMIT 5
"""

[[questions]]
id = "top10_customers_last_12_months"
split = "test"
category = "ranking"
question = "Top 10 customers by net revenue over the last 12 months"
expect = "answer"
match = "rows"
reference_sql = """
SELECT c.customer_name, a.net_revenue_last_12_months
FROM customer_activity a JOIN customers c USING (customer_id)
