expect = "answer"
match = "rows"
reference_sql = """
SELECT date_trunc('month', invoice_date) AS month, SUM(net_revenue)
FROM sales_lines WHERE invoice_date >= DATE '2026-04-01' AND invoice_date <= DATE '2026-09-30'
GROUP BY 1
"""

[[questions]]
id = "rev_by_region_2025"
split = "dev"
category = "revenue"
question = "Chiffre d'affaires net par région en 2025"
