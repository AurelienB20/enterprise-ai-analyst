WHERE NOT EXISTS (SELECT 1 FROM invoices i WHERE i.customer_id = c.customer_id AND i.is_overdue)
GROUP BY c.segment
"""

[[questions]]
id = "payment_delay_by_segment_2026"
split = "test"
category = "multi_step"
question = "Average payment delay in days by customer segment, for invoices issued in 2026 and already settled"
expect = "answer"
match = "rows"
reference_sql = """
SELECT customer_segment, AVG(i.days_paid_late)
FROM invoices i JOIN (SELECT customer_id, segment AS customer_segment FROM customers) c USING (customer_id)
WHERE i.is_settled AND i.invoice_date >= DATE '2026-01-01'
GROUP BY customer_segment
"""
