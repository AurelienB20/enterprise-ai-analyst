# ---------------------------------------------------------------- multi-step questions
# Added after the first runs saturated (every configuration at 100 %): these need several
# steps, a window function or a careful definition, and separate configurations better.

[[questions]]
id = "lost_customers_2026"
split = "dev"
category = "multi_step"
question = "Combien de clients ont été facturés en 2025 mais jamais en 2026 ?"
expect = "answer"
match = "first"
reference_sql = """
SELECT COUNT(*) FROM (
    SELECT customer_id FROM sales_lines
    GROUP BY customer_id
    HAVING bool_or(invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01')
       AND NOT bool_or(invoice_date >= DATE '2026-01-01')
) lost
"""

[[questions]]
id = "best_customer_per_region_2025"
split = "test"
category = "multi_step"
question = "Pour chaque région, quel est le client qui a généré le plus de chiffre d'affaires net en 2025 ?"
expect = "answer"
match = "rows"
reference_sql = """
SELECT region, customer_name FROM (
    SELECT s.customer_region AS region, c.customer_name,
           RANK() OVER (PARTITION BY s.customer_region ORDER BY SUM(s.net_revenue) DESC) AS r
    FROM sales_lines s JOIN customers c USING (customer_id)
    WHERE s.invoice_date >= DATE '2025-01-01' AND s.invoice_date < DATE '2026-01-01'
    GROUP BY s.customer_region, c.customer_name
) ranked WHERE r = 1
"""

[[questions]]
id = "qoq_growth_2026"
split = "dev"
category = "multi_step"
question = "For each quarter of 2026, what was the net revenue growth versus the previous quarter, in percent?"
expect = "answer"
match = "contains"
note = "Only the growth figures are compared: quarters may be labelled in many ways."
reference_sql = """
SELECT growth FROM (
    SELECT date_trunc('quarter', invoice_date) AS q,
           SUM(net_revenue) / LAG(SUM(net_revenue)) OVER (ORDER BY date_trunc('quarter', invoice_date)) - 1 AS growth
    FROM sales_lines WHERE invoice_date >= DATE '2025-10-01'
    GROUP BY 1
) g WHERE q >= DATE '2026-01-01'
"""

[[questions]]
id = "top20_share_2025"
split = "test"
category = "multi_step"
question = "Quelle part du chiffre d'affaires net de 2025 vient des 20 plus gros clients de 2025 ?"
expect = "answer"
match = "first"
reference_sql = """
WITH c AS (
    SELECT customer_id, SUM(net_revenue) AS revenue FROM sales_lines
    WHERE invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01'
    GROUP BY customer_id
)
SELECT (SELECT SUM(revenue) FROM (SELECT revenue FROM c ORDER BY revenue DESC LIMIT 20) t)
       / SUM(revenue) FROM c
"""

[[questions]]
id = "customers_over_10k_2025"
split = "dev"
category = "multi_step"
question = "How many customers had more than 10,000 euros of net revenue in 2025?"
expect = "answer"
match = "first"
reference_sql = """
SELECT COUNT(*) FROM (
    SELECT customer_id FROM sales_lines
    WHERE invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01'
    GROUP BY customer_id HAVING SUM(net_revenue) > 10000
) c
"""

