# Evaluation questions, for the synthetic dataset generator v2, seed 42 (small or full:
# the reference SQL runs on whatever is loaded, the anomalies hold for seed 42).
#
# expect = "answer": the generated result must match the result of reference_sql
#   (eaa.evaluation.compare; match = rows | first | contains, ordered = true|false).
# expect = "decline": the model must call cannot_answer with one of accepted_reasons,
#   and nothing may run.
# anomaly: the injected anomaly the reference answer must be (checked by a test).
# split: dev questions guide changes; test questions only confirm them, never tune them.
#
# Relative periods follow the prompt's rules: the reference date is 2026-09-30, "last
# month" is August 2026, "this quarter" is Q3 2026.

version = 2

# ---------------------------------------------------------------- revenue and volumes

[[questions]]
id = "rev_last_month"
split = "dev"
category = "revenue"
question = "Quel est le chiffre d'affaires net du mois dernier ?"
expect = "answer"
match = "rows"
reference_sql = """
SELECT SUM(net_revenue) FROM sales_lines
WHERE invoice_date >= DATE '2026-08-01' AND invoice_date < DATE '2026-09-01'
"""

[[questions]]
id = "rev_2025"
split = "test"
category = "revenue"
question = "What was the net revenue for 2025?"
expect = "answer"
match = "rows"
reference_sql = """
SELECT SUM(net_revenue) FROM sales_lines
WHERE invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01'
"""

[[questions]]
id = "rev_by_quarter_2025"
split = "dev"
category = "trend"
question = "Donne le chiffre d'affaires net de chaque trimestre de 2025."
expect = "answer"
match = "rows"
ordered = false
reference_sql = """
SELECT extract(quarter FROM invoice_date) AS quarter, SUM(net_revenue)
FROM sales_lines WHERE invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01'
GROUP BY 1
"""

[[questions]]
