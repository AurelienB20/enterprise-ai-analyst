match = "first"
reference_sql = """
SELECT SUM(net_revenue) FILTER (WHERE invoice_date >= DATE '2026-01-01')
       / SUM(net_revenue) FILTER (WHERE invoice_date < DATE '2025-10-01') - 1
FROM sales_lines
WHERE (invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2025-10-01')
   OR (invoice_date >= DATE '2026-01-01' AND invoice_date <= DATE '2026-09-30')
"""

