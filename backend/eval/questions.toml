"""

[[questions]]
id = "biggest_drop_customers"
split = "dev"
category = "ranking"
question = "Quels sont les 10 clients dont le chiffre d'affaires net a le plus baissé ce trimestre par rapport au trimestre précédent ?"
expect = "answer"
match = "contains"
note = "Only the names are compared: the model may express the drop as an amount or a rate."
reference_sql = """
SELECT c.customer_name
FROM sales_lines s JOIN customers c USING (customer_id)
WHERE s.invoice_date >= DATE '2026-04-01' AND s.invoice_date <= DATE '2026-09-30'
GROUP BY c.customer_name
ORDER BY COALESCE(SUM(s.net_revenue) FILTER (WHERE s.invoice_date >= DATE '2026-07-01'), 0)
       - COALESCE(SUM(s.net_revenue) FILTER (WHERE s.invoice_date < DATE '2026-07-01'), 0) ASC
LIMIT 3
"""

