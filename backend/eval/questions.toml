[[questions]]
id = "biggest_monthly_jump_2025"
split = "dev"
category = "multi_step"
question = "Quel mois de 2025 a connu la plus forte hausse de chiffre d'affaires net par rapport au mois précédent ? Donne le numéro du mois."
expect = "answer"
match = "first"
reference_sql = """
SELECT m FROM (
    SELECT extract(month FROM date_trunc('month', invoice_date)) AS m,
           SUM(net_revenue) - LAG(SUM(net_revenue)) OVER (ORDER BY date_trunc('month', invoice_date)) AS jump
    FROM sales_lines WHERE invoice_date >= DATE '2024-12-01' AND invoice_date < DATE '2026-01-01'
    GROUP BY date_trunc('month', invoice_date)
) j WHERE jump IS NOT NULL ORDER BY jump DESC LIMIT 1
"""

[[questions]]
