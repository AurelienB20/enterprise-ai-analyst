# Lint, type-check and test the backend. No API key is needed: tests that call the real
# Anthropic API (-m live) are never run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      # The database tests migrate this disposable eaa_test database up and down.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eaa_owner
          POSTGRES_PASSWORD: eaa_owner
          POSTGRES_DB: eaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eaa_owner -d eaa_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://eaa_owner:eaa_owner@127.0.0.1:5432/eaa_test
      TEST_READER_DATABASE_URL: postgresql://eaa_reader:eaa_reader@127.0.0.1:5432/eaa_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -W error
      - name: Create the reader role
        run: >-
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -v reader_password=eaa_reader
          -f scripts/create_reader_role.sql
      - name: Database tests (PostgreSQL 16)
        run: uv run pytest -W error -m db
